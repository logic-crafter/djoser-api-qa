# 说明：本文件是 `.github/workflows/ci.yml` 的副本。
# 当前 GitHub App 的写入策略禁止直接创建 `.github/workflows/` 下的文件，
# 因此保留此副本；如需启用 CI，请将其内容复制到 `.github/workflows/ci.yml`。
#
# ---

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:00 UTC 定时回归，监控上游 djoser 发布是否引入回归
    - cron: "0 3 * * 1"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run test suite
        run: pytest -v --html=reports/report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: reports/report.html
          if-no-files-found: ignore

  config-matrix:
    name: 配置矩阵复现（独立进程）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run config matrix tests
        run: pytest -v -m slow tests/test_05_config_matrix.py

      - name: Run UI automation tests
        run: pytest -v -m ui tests/test_08_ui.py --html=reports/ui-report.html --self-contained-html

      - name: Run concurrency tests (repeat ×3 for flakiness detection)
        run: |
          for i in 1 2 3; do
            echo "=== concurrency run $i ==="
            pytest -v -m concurrency || exit 1
          done
