[pytest]
DJANGO_SETTINGS_MODULE = testenv.settings
python_files = test_*.py
testpaths = tests
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    smoke: 冒烟用例，每轮必跑
    regression: 缺陷回归用例
    contract: 接口契约与 Schema 一致性校验
    boundary: 边界值用例
    negative: 异常与非法输入用例
    concurrency: 并发与幂等用例
    slow: 需要启动子进程或较长时间的用例
    ui: UI 自动化用例（需要 Playwright 浏览器二进制）
filterwarnings =
    ignore::DeprecationWarning
